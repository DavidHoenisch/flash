[project]
name = "flash-lab"
version = "0.1.0"
description = "Offline experiments for an open, portable radio data modem"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
radio = [
    "pyserial>=3.5,<4",
    "sounddevice>=0.5,<0.6",
]

[tool.uv]
package = false

